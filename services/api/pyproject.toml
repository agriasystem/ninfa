[project]
name = "ninfa-api"
# Single source of truth for the application version (exposed by /api/v1/health).
version = "0.1.0"
description = "NINFA backend API (FastAPI modular monolith)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.53,<0.54",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3.6,<3.4",
    # IANA timezone database for zoneinfo validation; Windows and slim images ship none.
    "tzdata>=2025.2",
    # Reads .xlsx booking exports (streaming read-only mode). The only new dependency of Gate 2.
    "openpyxl>=3.1.5,<3.2",
    # Argon2id password hashing (Gate 13). No existing dependency provides it; this is the
    # mature, maintained CFFI binding the OWASP/Argon2 reference implementation ships.
    "argon2-cffi>=25.1,<26",
    # Official Anthropic Python SDK (Gate 19): the ONLY vendor-specific runtime dependency in this
    # codebase, isolated to app/modules/ai/gateway/anthropic_provider.py - see ADR 0025.
    "anthropic>=1.8.0,<2",
    "openai>=3.50,<4",
    # Smart Import V4.1 (algorithmic understanding, ADR 0056). RapidFuzz measures how alike two WORDS
    # are (header spelling mistakes). MIT, no dependencies, imported only by
    # `data_sources/algorithmic`.
    "rapidfuzz>=3.14,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.13,<3",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
    # Smart Import V4.1: the CSV dialect readers (`data_sources/algorithmic/dialect.py`). DEV ONLY on
    # purpose: measured, they added nothing for the delimiters NINFA's importers read (see the
    # benchmark report), so production does not ship them. The reader imports them lazily and is a
    # no-op without them; moving the three lines below to `dependencies` turns it on. fsspec lets
    # DuckDB read the file from memory, so customer data is never written to a temporary file.
    "duckdb>=2.0,<3",
    "clevercsv>=0.8,<0.9",
    "fsspec>=2026.9",
    # Smart Import V4.1: SciPy's `linear_sum_assignment` (the `v4-assign` engine). DEV ONLY for the same
    # reason: over 1,026 documents the global assignment changed ONE reading, for the worse, so the
    # default engine is V3's greedy pick over V4's evidence. The assignment imports SciPy lazily.
    "scipy>=1.18,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
