[project]
name = "ninfa-api"
# Single source of truth for the application version (exposed by /api/v1/health).
version = "0.1.0"
description = "NINFA backend API (FastAPI modular monolith)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.53,<0.54",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3.6,<3.4",
    # IANA timezone database for zoneinfo validation; Windows and slim images ship none.
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.13,<3",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
